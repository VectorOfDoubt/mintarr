# Mintarr Python project metadata.
# Build/dist configuration is currently container-only (Dockerfile drives
# pip install); this file primarily holds tool configuration.

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Strict typing is a v0.2.0 goal; v0.1.0 accepts the existing surface.
follow_imports = "silent"

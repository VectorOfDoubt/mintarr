name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when new commits land on the same PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build base image
        run: |
          docker build -t mintarr:local -f Dockerfile .

      - name: Build test image
        run: |
          docker compose -f docker-compose.test.yaml build tests

      - name: Run pytest
        run: |
          docker compose -f docker-compose.test.yaml run --rm tests

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install 'ruff==0.4.5'

      - name: ruff check
        run: ruff check app tests

      - name: ruff format check
        run: ruff format --check app tests scripts

      - name: Verify immutable supply-chain references
        run: python scripts/check_supply_chain_pins.py

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: mypy
        run: mypy app

  commit-lint:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Lint PR commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          configFile: '.commitlintrc.yaml'

  fork-security-probe:
    name: Fork security probe
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      FORK_SECURITY_SENTINEL: ${{ secrets.FORK_SECURITY_SENTINEL }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Assert secret isolation, read-only token and hosted runner
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${FORK_SECURITY_SENTINEL}" ]]; then
            echo "Repository secret was exposed to fork PR code." >&2
            exit 1
          fi

          if [[ "${RUNNER_ENVIRONMENT}" != "github-hosted" ]]; then
            echo "Fork PR did not run on a GitHub-hosted runner." >&2
            exit 1
          fi

          response_code="$(
            curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --data '{"body":"fork-security-probe-unexpected-write"}'
          )"
          if [[ "${response_code}" != "403" ]]; then
            echo "Expected write denial (403), received ${response_code}." >&2
            exit 1
          fi

          echo "Fork PR isolation verified."

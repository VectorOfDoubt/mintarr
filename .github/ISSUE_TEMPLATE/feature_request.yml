name: Feature request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["feature", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request:

        - Read [VISION.md](https://eivindsjursen-lab.github.io/mintarr/strategy/VISION/) and [ADR-0008](https://eivindsjursen-lab.github.io/mintarr/architecture/adr/0008-strategic-positioning/)
        - Apply the [boundary test from ADR-0008](https://eivindsjursen-lab.github.io/mintarr/architecture/adr/0008-strategic-positioning/) to your proposal
        - Search [existing issues](https://github.com/eivindsjursen-lab/mintarr/issues) for similar requests
        - For new connectors (TIDAL alternatives, new verifiers, etc.), use the "Connector request" template instead

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Describe the use case, not the solution.
      placeholder: |
        When I do X with Mintarr, Y happens. I'd like Z to be possible.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Your suggested feature. Be specific about scope.
      placeholder: |
        Add a setting/endpoint/dashboard tab that ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else have you tried or thought about?
      placeholder: |
        I considered doing this via Lidarr directly, but Lidarr doesn't ...
        I considered a script that ...
    validations:
      required: true

  - type: dropdown
    id: boundary
    attributes:
      label: Boundary test (ADR-0008)
      description: Which step of the boundary test does your proposal fall under?
      options:
        - "1. Improves QC accuracy, source coverage, evidence, policy precision, audit clarity, or import safety"
        - "2. Improves operator experience of existing Mintarr scope"
        - "3. Requires Mintarr to track/manage/own something Lidarr already owns"
        - "4. Reduces Lidarr coupling without expanding library-management scope"
        - "Unsure"
    validations:
      required: true

  - type: textarea
    id: scope-discussion
    attributes:
      label: Scope discussion
      description: |
        If your proposal falls under step 3 of the boundary test (Lidarr's territory),
        this proposal will likely be closed. Use this section to explain why you believe
        it fits Mintarr's scope, or describe a Mintarr-shaped version of the idea.
    validations:
      required: false

  - type: dropdown
    id: importance
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would meaningfully improve my workflow
        - Blocks my use of Mintarr
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have read VISION.md and ADR-0008
          required: true
        - label: I have applied the boundary test
          required: true
        - label: I have searched existing issues for duplicates
          required: true
